<div class="page">
  <div class="form-shell">
    <div class="topbar">
      <a class="back-link" href="/">← Back to home</a>
    </div>

    <section class="panel">
      <header class="hero">
        <div>
          <span class="eyebrow">Customers</span>
          <h1>Edit customer</h1>
          <p>Update the customer name used in borrowing records.</p>
        </div>

        <div class="hero-icon" aria-hidden="true">&#128100;</div>
      </header>

      <form class="form">
        <div class="form-grid">
          <div class="field full">
            <label for="customer-name">Name</label>
            <input
              id="customer-name"
              name="name"
              type="text"
              placeholder="Customer name"
              [(ngModel)]="name"
            />
          </div>
        </div>

        <p class="message error" hidden>Could not update customer.</p>
        <p class="message success" hidden>Customer updated.</p>

        <div class="actions">
          <a class="btn secondary" href="/">Cancel</a>
          <button class="btn primary" type="button" (click)="saveEdit()">Save</button>
        </div>
      </form>
    </section>
  </div>
</div>
